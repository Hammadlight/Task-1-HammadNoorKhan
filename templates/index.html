<!DOCTYPE html>
<html>

<head>
    <title>My To-Do List</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>My To-Do List</h1>

    <div class="input-box">

        <input
            type="text"
            id="taskInput"
            placeholder="Plan meals for the week">

        <button onclick="addTask()">
            Add
        </button>

    </div>

    <div id="taskList"></div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
